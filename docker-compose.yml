services:
  redis:
    image: redis:7
    container_name: sf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: sf-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
      - ./minio.license:/minio.license:ro
    command:
      - server
      - /data
      - --console-address
      - ":9001"
      - --license
      - /minio.license
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: sf-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: document_intelligence
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sf-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    container_name: sf-flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    command:
      - celery
      - --broker=redis://redis:6379/0
      - flower
      - --address=0.0.0.0
      - --port=5555
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  mongodb_data:
  qdrant_data:
