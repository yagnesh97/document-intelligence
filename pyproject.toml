[project]
name = "smart-finance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anyio<4.15",
    "boto3>=1.43.91",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "fastembed>=0.9.0",
    "google-genai>=2.32.0",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langsmith>=0.14.12",
    "numpy>=2.5.4",
    "ocrmypdf>=17.12.1",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.52.4",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
exclude = ["tests/fixtures/pdf/sample-files"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external services",
]
addopts = "-m 'not integration'"
